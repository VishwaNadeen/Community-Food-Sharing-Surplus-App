```yaml
name: foodlink
description: "FoodLink - Community Food Sharing & Surplus App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.9
  flutter_svg: ^2.0.10+1

  # State management
  provider: ^6.1.5+1

  # REST API communication
  http: ^1.6.0
  http_parser: ^4.1.2

  # Device location / GPS
  geolocator: ^14.0.3

  # Google Maps
  google_maps_flutter: ^2.18.0

  # OpenStreetMap - donor profile location picker
  flutter_map: ^8.2.2
  latlong2: ^0.9.1

  # Token persistence
  shared_preferences: ^2.5.3

  # Donation photo picker
  image_picker: ^1.1.2

  # File and path management
  path_provider: ^2.1.6
  file_picker: ^13.1.0

  # Share functionality
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # App launcher icon generator
  flutter_launcher_icons: ^0.14.3

# App Icon Configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.jpg"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon.jpg"
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
```