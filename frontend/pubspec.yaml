name: foodlink
description: "FoodLink - Community Food Sharing & Surplus App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9

  # State management
  provider: ^6.1.5+1

  # REST API communication with Node.js + Express
  http: ^1.6.0

  # Device location / GPS
  geolocator: ^14.0.3

  # Google Maps
  google_maps_flutter: ^2.18.0

  # Real brand icons (Google, Apple, Facebook, etc.) for the social login row
  flutter_svg: ^2.0.10+1

  # Token persistence across app restarts
  shared_preferences: ^2.5.3

  # Donation photo picker (gallery / camera)
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # App launcher icon generator
  flutter_launcher_icons: ^0.14.3

# ─── App Icon Configuration ────────────────────────────────────────────────────
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.jpg"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon.jpg"
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false

flutter:
  uses-material-design: true

  assets:
    - assets/icon/